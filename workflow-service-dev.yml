spring:
  datasource:
    url: ${WORKFLOW_DATASOURCE_URL}
    username: ${WORKFLOW_DATASOURCE_USERNAME}
    password: ${WORKFLOW_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


flowable:
  database-schema-update: true

  process:
    async-executor-activate: true
    async-executor-core-pool-size: 5
    async-executor-max-pool-size: 10
    async-executor-queue-capacity: 1000

  mail:
    server:
      host: smtp.gmail.com
      port: 587
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      use-tls: true
      use-ssl: false
      default-from: medilink.support1@gmail.com
      default-charset: UTF-8