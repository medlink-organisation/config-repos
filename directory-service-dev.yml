
server:
  port: 8060

spring:
  datasource:
    url: ${DIRECTORY_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver

    username: ${DIRECTORY_DATASOURCE_USERNAME}
    password: ${DIRECTORY_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

info:
  application:
    name: Directory Service
    description: Gestion des cliniques, blocs, services médicaux et affectations des praticiens
