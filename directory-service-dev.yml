spring:

  datasource:
    url: jdbc:postgresql://${DIRECTORY_DB_HOST:localhost}:${DIRECTORY_DB_PORT:5432}/${DIRECTORY_DB_NAME:directory_db}
    username: ${DIRECTORY_DB_USER:directory}
    password: ${DIRECTORY_DB_PASSWORD:directory}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    medlink.project.directoyservice: DEBUG
    org.hibernate.SQL: DEBUG
