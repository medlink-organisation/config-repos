server:
  port: 8066
  shutdown: graceful
  
spring:
  datasource:
    url: ${MEDICAL_DATASOURCE_URL}
    username: ${MEDICAL_DATASOURCE_USERNAME}
    password: ${MEDICAL_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

 
  grpc:
    server:
      port: ${GRPC_SERVER_PORT}


medical:
  files:
    max-pdf-size-bytes: ${MEDICAL_PDF_MAX_SIZE_BYTES:10485760}

clamav:
  host: ${CLAMAV_HOST:clamav}
  port: ${CLAMAV_PORT:3310}
  timeout: ${CLAMAV_TIMEOUT:30000}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  allow-http: true
  sse-kms-key-id: ""