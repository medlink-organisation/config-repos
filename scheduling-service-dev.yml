server:
  port: 8065
  shutdown: graceful
spring:
  datasource: 
    url: ${SCHEDULING_DATASOURCE_URL}
    username: ${SCHEDULING_DATASOURCE_USERNAME}
    password: ${SCHEDULING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

 
  grpc:
    server:
      port: ${GRPC_SERVER_PORT}
