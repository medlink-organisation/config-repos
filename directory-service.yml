server:
  port: 8060

spring:

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/medilink}

management:
  info:
    env:
      enabled: true

info:
  application:
    name: MedLink Directory Service
    description: Gestion des cliniques, blocs, services médicaux et affectations des praticiens
